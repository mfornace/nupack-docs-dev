site_dir: _build/site
site_name: NUPACK User Guide

theme:
  name: material
  language: en

# theme:
#   name: material
#     primary: orange
#     accent: orange
#   language: en
#   palette:

plugins:
  - search
  # - pdf-export

markdown_extensions:
  - pymdownx.arithmatex
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - footnotes
  - sane_lists
  - smarty
  - admonition
  # - codehilite
  # - abbr
  - pymdownx.betterem:
      smart_enable: all
  - toc:
      permalink: true
  - mdx_bib:
      bibtex_file: nupack.bib
      order: unsorted

extra_javascript:
  - 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML'


extra_css:
  - extra.css


site_name: NUPACK 4 User Guide
repo_url: http://nupack.org/
site_url: https://docs.nupack.org

theme:
  name: readthedocs
  language: en

#theme:
#  name: material
#  language: en
#  custom_dir: overrides
#  features:
#  - instant

  # logo: nupack-hairpin.svg
  # - tabs

  # palette:
  #   primary: orange
  #   accent: blue
# theme:
#   name: material
#     primary: orange
#     accent: orange
#   language: en
#   palette:

plugins:
  - search
  - mike:
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ''
      canonical_version: latest
      version_selector: true
      css_dir: ./sources
      javascript_dir: js
  # - pdf-export

markdown_extensions:
  # - markdown_include.include:
  #     base_path: sources
      # headingOffset: 1
  - pymdownx.arithmatex
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - footnotes
  - sane_lists
  - smarty
  - admonition
  # - codehilite
  # - abbr
  - pymdownx.betterem:
      smart_enable: all
  - toc:
      permalink: true
      # toc_depth: 2
  - mdx_bib:
      bibtex_file: nupack.bib
      order: unsorted

extra_javascript:
  - 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-MML-AM_CHTML'


extra_css:
  - extra.css

